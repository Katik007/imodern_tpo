[pytest]
testpaths = autotest
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --alluredir=allure-results
    --clean-alluredir
    --allure-no-capture
    -p no:playwright
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
markers =
    auth: проверки авторизации
    shop: публичный путь от каталога до оформления
    e2e: полное создание заказа
